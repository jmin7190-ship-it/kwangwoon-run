<!DOCTYPE html>
<html>
<body>
    <select id="bldg" onchange="update()">
        <option value="bima">비마관</option>
        <option value="chambit">참빛관</option>
        <option value="library">중앙도서관</option>
    </select>
    <select id="station" onchange="update()">
        <option value="11285">정문 앞 정류장</option>
        <option value="11279">광운대역 정류장</option>
    </select>

    <div id="result">
        <h2>실시간 정보 갱신까지 <span id="timer">60</span>초</h2>
        <div id="action-msg"></div>
    </div>

    <script>
        let timer = 60;
        function update() {
            let bldg = document.getElementById('bldg').value;
            let station = document.getElementById('station').value;
            fetch(`/api/bus?bldg=${bldg}&station=${station}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('action-msg').innerText = d.message;
                    timer = 60;
                });
        }
        
        setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if(timer <= 0) update();
        }, 1000);
    </script>
</body>
</html>
