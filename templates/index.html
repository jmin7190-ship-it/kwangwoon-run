<!DOCTYPE html>
<html>
<head>
    </head>
<body>
    <div id="bus-container">
        <button onclick="setBldg('bima')">비마관</button>
        <div id="station-btns">
            <button onclick="setStation('11285')">정문 앞 방면</button>
            <button onclick="setStation('11279')">광운대역 방면</button>
        </div>

        <h2>실시간 정보 갱신까지 <span id="timer">60</span>초</h2>
        <div id="bus-list"></div>
    </div>

    <script>
        // 기존 JS 로직 유지
        let timer = 60;
        let bldg = 'bima';
        let station = '11285';

        function setBldg(b) { bldg = b; fetchData(); }
        function setStation(s) { station = s; fetchData(); }

        function fetchData() {
            fetch(`/api/bus?start=${bldg}&station=${station}`)
            .then(r => r.json())
            .then(d => {
                // 기존 데이터 뿌려주는 UI 로직들 그대로
                timer = 60; // 갱신 시 리셋
            });
        }

        // 60초 리셋 타이머
        setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if(timer <= 0) fetchData();
        }, 1000);
    </script>
</body>
</html>
